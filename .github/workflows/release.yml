name: Deploy to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build project
        env:
          VITE_UPTOWN_URL: ${{ secrets.UPTOWN_URL }}
          VITE_YOGAZAMA_URL: ${{ secrets.YOGAZAMA_URL }}
          VITE_V12YOGA_URL: ${{ secrets.V12YOGA_URL }}
          VITE_PILATESMETHODOLOGY_URL: ${{ secrets.PILATESMETHODOLOGY_URL }}
        run: bun run build

      # Upload only the client output
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client/
        
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
