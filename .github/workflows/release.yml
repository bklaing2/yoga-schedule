name: Deploy to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build project
        env:
          PILATESMETHODOLOGY_API: ${{ secrets.PILATESMETHODOLOGY_API }}
          UPTOWN_API: ${{ secrets.UPTOWN_API }}
          V12YOGA_API: ${{ secrets.V12YOGA_API }}
          YOGAZAMA_API: ${{ secrets.YOGAZAMA_API }}

          VITE_PILATESMETHODOLOGY_HREF: ${{ secrets.PILATESMETHODOLOGY_HREF }}
          VITE_UPTOWN_HREF: ${{ secrets.UPTOWN_HREF }}
          VITE_V12YOGA_HREF: ${{ secrets.V12YOGA_HREF }}
          VITE_YOGAZAMA_HREF: ${{ secrets.YOGAZAMA_HREF }}
        run: TZ='America/Chicago' bun run build

      # Upload only the client output
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client/

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
